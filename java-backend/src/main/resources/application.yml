spring:
  application:
    name: verify-code-grpc
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/xinyu}
    username: ${DB_USERNAME:postgres}
    password: 123456 # 内部测试环境凭据，生产环境必须改为外部 Secret
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:5000}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 2
    baseline-description: existing-phase1-schema
    clean-disabled: true
  sql:
    init:
      mode: never
  grpc:
    server:
      port: 9090
  mail:
    host: smtp.163.com
    port: 465
    username: 18156944123@163.com
    password: HUOUWJGYIECRSNBH   # 网易邮箱 SMTP 授权码（环境变量）${MAIL_163_AUTH_CODE}
    properties:
      mail:
        debug: true
        smtp:
          auth: true
          ssl:
            enable: true
          timeout: 5000
          connectiontimeout: 5000
          writetimeout: 5000
  data:
    redis:
      host: 127.0.0.1
      port: 6379

mybatis-plus:
  type-handlers-package: com.xinyu.common.mybatis.typehandler
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false

